<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>迷路ゲーム</title>
<style>
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1d2c52,#0b1020 70%);
      color:#eef2ff;font-family:"Segoe UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
      display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 14px 28px;}
 .titlebar{display:flex;align-items:center;gap:10px;margin-top:2px;}
 .titlebar .em{font-size:26px;filter:drop-shadow(0 2px 5px #000);}
 .titlebar h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.08em;text-shadow:0 2px 12px #000;}
 .note{margin:-4px 0 2px;font-size:12px;color:#8aa0d0;text-align:center;line-height:1.6;}
 .screen{position:relative;padding:10px;border-radius:18px;
         background:linear-gradient(180deg,#141a30,#0d1224);
         border:1px solid #2a375f;box-shadow:0 10px 30px #000a,inset 0 0 0 1px rgba(255,255,255,0.03);}
 #game{display:block;width:min(440px,90vw);height:auto;border-radius:10px;background:#0e1428;touch-action:none;}
 .hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
 .chip{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
       background:linear-gradient(180deg,#1a2240,#141a30);border:1px solid #2a375f;
       font-size:15px;font-weight:700;min-width:86px;justify-content:center;}
 .chip .ic{font-size:15px;}
 .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px;}
 .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:11px;cursor:pointer;
      font-size:14px;font-weight:700;color:#eef2ff;
      background:linear-gradient(180deg,#222c50,#1a2240);border:1px solid #38477a;
      transition:transform .1s,border-color .1s,box-shadow .1s;}
 .btn:hover{border-color:#ffd45e;box-shadow:0 4px 14px #0008;transform:translateY(-1px);}
 .btn.gold{border-color:#caa23a;background:linear-gradient(180deg,#3a3417,#2a2410);}
 /* スマホ用 仮想ゲームパッド（十字＋A/B）。RPG版と同じ見た目 */
 #pad{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;
      width:min(440px,90vw);margin:8px auto 0;padding:0 4px;touch-action:none;
      -webkit-user-select:none;user-select:none;}
 .dpad{position:relative;width:162px;height:162px;flex:0 0 auto;}
 .db{position:absolute;width:54px;height:54px;border:none;border-radius:12px;padding:0;
     background:rgba(26,34,64,.9);color:#cfe0ff;font-size:20px;line-height:54px;text-align:center;
     box-shadow:0 3px 0 #0a1228,inset 0 0 0 2px #3a4870;cursor:pointer;touch-action:none;}
 .db:active{transform:translateY(2px);background:#27365e;color:#fff;
     box-shadow:0 1px 0 #0a1228,inset 0 0 0 2px #ffd23f;}
 .db.up{left:54px;top:0}.db.left{left:0;top:54px}.db.right{left:108px;top:54px}.db.down{left:54px;top:108px}
 .ab{display:flex;align-items:center;gap:14px;flex:0 0 auto;padding-bottom:6px;}
 .ab button{border:none;border-radius:50%;color:#1a1228;font-weight:700;cursor:pointer;
     touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.45);}
 #btnB{width:58px;height:58px;font-size:20px;background:#8fb3ff;}
 #btnA{width:74px;height:74px;font-size:17px;background:#ffd23f;}
 .ab button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45);}
</style>
</head>
<body>
<div class="titlebar"><span class="em">🧩</span><h1>迷路ゲーム</h1></div>
<div class="note">PC: WASD / 矢印で移動・Enter決定・Rリスタート　｜　スマホ: 下の十字ボタン／タップ　｜　ジョイスティック対応</div>
<div class="screen"><canvas id="game" width="800" height="800"></canvas></div>
<div class="hud">
 <div class="chip"><span class="ic">⏱️</span><span id="timer">0.0s</span></div>
 <div class="chip"><span class="ic">🪙</span><span id="coininfo">0/0</span></div>
 <div class="chip"><span class="ic">🏆</span><span id="best">--</span></div>
</div>
<div class="controls">
 <button id="restartBtn" class="btn">↺ やり直す</button>
 <button id="stagesBtn" class="btn">▦ ステージ選択</button>
 <button class="btn gold" onclick="location.href='/'">← ゲーム選択</button>
</div>
<div id="pad">
 <div class="dpad">
  <button class="db up"    data-k="ArrowUp">▲</button>
  <button class="db left"  data-k="ArrowLeft">◀</button>
  <button class="db right" data-k="ArrowRight">▶</button>
  <button class="db down"  data-k="ArrowDown">▼</button>
 </div>
 <div class="ab">
  <button id="btnB">↺</button>
  <button id="btnA">決定</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const TILE=40;

// ====== ステージ定義 ======
// 記号: # 壁 / 空白 床 / S スタート / G ゴール / C コイン / E 敵
const stages=[
 { name:"Stage 1", map:[
   "#############",
   "#S #    E   #",
   "#  #C       #",
   "#  #  #  ####",
   "#  #  #     #",
   "#  #  # C   #",
   "# C#######  #",
   "#C       #  #",
   "#        #  #",
   "#######  #  #",
   "#       C  C#",
   "#      E   G#",
   "#############"]},
 { name:"Stage 2", map:[
   "################",
   "#S #    C   C  #",
   "#  #           #",
   "#  #######  #E #",
   "#     #     #  #",
   "#     #C CE #  #",
   "####  #  #  #  #",
   "#  #   C #     #",
   "#  #C    #     #",
   "#  #######  ####",
   "#E #     #     #",
   "#  #     #     #",
   "#C #  #  ####  #",
   "#     #       E#",
   "#    C#       G#",
   "################"]},
 { name:"Stage 3", map:[
   "###################",
   "#S #         C    #",
   "#  #     E        #",
   "#  ####  ####  # C#",
   "# E       E #  # C#",
   "#      C C  #  #  #",
   "##########  ####  #",
   "#  C  CE #     #  #",
   "#        #     #  #",
   "####  #  ####  #  #",
   "#        #  C  #  #",
   "#     C  #     #  #",
   "#  ####  #  ####  #",
   "#        #  #C    #",
   "#        #  #     #",
   "#  #  ####  ####E #",
   "#  #          E   #",
   "#  #             G#",
   "###################"]},
];

// ====== 状態 ======
let screen="select";       // "select" | "playing" | "clear"
let selIndex=0;            // ステージ選択カーソル
let stageIndex=0;
let map=[];
let player, playerStart, goal;
let coins=[], enemies=[];
let totalCoins=0, gotCoins=0;
let target=null;
let keys={};
let startTime=0, clearTime=0;
let cameraX=0, cameraY=0;

// ジョイスティック由来の移動・操作
let joyVX=0, joyVY=0;
let navReady=true, btnReady=true;

// 4方向移動：最後に押した方向を優先（斜め移動を防ぐ）
const DIR_OF={w:"up",s:"down",a:"left",d:"right",arrowup:"up",arrowdown:"down",arrowleft:"left",arrowright:"right"};
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
let dirStack=[];

// ====== 効果音（8bit風・Web Audio） ======
let audioCtx=null;
function initAudio(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
}
// 単音ビープ。type:波形, f0->f1で周波数スライド可
function beep(f0,f1,dur,type="square",vol=0.15){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0) osc.frequency.linearRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t+dur);
}
function sfxStep(){ beep(220,180,0.05,"square",0.05); }          // 移動：低く短いコツコツ音
function sfxCoin(){ beep(880,1320,0.08,"square",0.12); }          // コイン：高く上がるピロン
function sfxHit(){ beep(400,60,0.4,"sawtooth",0.18); }            // やられ：下降するブブー
function sfxClear(){                                              // クリア：簡単なファンファーレ
  const seq=[[523,0],[659,120],[784,240],[1047,360]];
  seq.forEach(([f,ms])=>setTimeout(()=>beep(f,f,0.16,"square",0.14),ms));
}

// ====== 補助 ======
function bestKey(i){return "mazeBest_stage"+i;}
function getBest(i){return localStorage.getItem(bestKey(i));}

function hitsWall(x,y,size){
  const cols=map[0].length, rows=map.length;
  const l=Math.floor(x/TILE), r=Math.floor((x+size-1)/TILE);
  const t=Math.floor(y/TILE), b=Math.floor((y+size-1)/TILE);
  if(l<0||t<0||r>=cols||b>=rows) return true;
  return map[t][l]==="#"||map[t][r]==="#"||map[b][l]==="#"||map[b][r]==="#";
}
function aabb(ax,ay,as,bx,by,bs){
  return ax<bx+bs && ax+as>bx && ay<by+bs && ay+as>by;
}

function makeEnemy(tx,ty){
  const sx=tx*TILE+8, sy=ty*TILE+8;
  const e={x:sx, y:sy, size:24, vx:0, vy:0, sx:sx, sy:sy, patrol:4*TILE};
  const sp=1.2;
  const hOpen=(map[ty][tx-1]!=="#")||(map[ty][tx+1]!=="#");
  if(hOpen) e.vx=sp; else e.vy=sp;
  return e;
}

function loadStage(i){
  stageIndex=i;
  map=stages[i].map;
  coins=[]; enemies=[]; gotCoins=0; target=null;
  joyVX=0; joyVY=0; cameraX=0; cameraY=0;
  for(let y=0;y<map.length;y++){
    for(let x=0;x<map[y].length;x++){
      const c=map[y][x];
      if(c==="S"){ player={x:x*TILE+5,y:y*TILE+5,size:30,dir:"right",step:0};
                   playerStart={x:x*TILE+5,y:y*TILE+5}; }
      if(c==="G")  goal={x:x*TILE+20,y:y*TILE+20,radius:12};
      if(c==="C")  coins.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2,r:7,got:false});
      if(c==="E")  enemies.push(makeEnemy(x,y));
    }
  }
  totalCoins=coins.length;
  startTime=Date.now();
  screen="playing";
}

function respawn(){
  player.x=playerStart.x; player.y=playerStart.y; target=null;
}

// ====== 入力 ======
document.addEventListener("keydown",(e)=>{
  initAudio();
  const k=e.key.toLowerCase();
  keys[k]=true;
  // 矢印キーをWASDに正規化
  if(e.key==="ArrowUp")    keys["w"]=true;
  if(e.key==="ArrowDown")  keys["s"]=true;
  if(e.key==="ArrowLeft")  keys["a"]=true;
  if(e.key==="ArrowRight") keys["d"]=true;
  // 進行方向スタックに追加（最後に押した方向を優先）
  const _d=DIR_OF[k];
  if(_d && !dirStack.includes(_d)) dirStack.push(_d);
  if(screen==="select"){
    if(k==="w"||e.key==="ArrowUp")   selIndex=(selIndex-1+stages.length)%stages.length;
    if(k==="s"||e.key==="ArrowDown") selIndex=(selIndex+1)%stages.length;
    if(e.key==="Enter"||k===" ")     loadStage(selIndex);
  }else if(screen==="playing"){
    if(k==="r") loadStage(stageIndex);
    if(e.key==="ArrowUp"||e.key==="ArrowDown"||e.key==="ArrowLeft"||e.key==="ArrowRight") e.preventDefault();
  }else if(screen==="clear"){
    if(e.key==="Enter"||k==="r") screen="select";
  }
});
document.addEventListener("keyup",(e)=>{
  const k=e.key.toLowerCase();
  keys[k]=false;
  if(e.key==="ArrowUp")    keys["w"]=false;
  if(e.key==="ArrowDown")  keys["s"]=false;
  if(e.key==="ArrowLeft")  keys["a"]=false;
  if(e.key==="ArrowRight") keys["d"]=false;
  const _d=DIR_OF[k];
  if(_d) dirStack=dirStack.filter(d=>d!==_d);
});

document.getElementById("restartBtn").addEventListener("click",()=>{
  if(screen==="select") loadStage(selIndex); else loadStage(stageIndex);
});
document.getElementById("stagesBtn").addEventListener("click",()=>{ screen="select"; });
// スマホ用 仮想ゲームパッド（十字＝矢印キーを合成発火＝既存の移動/選択ロジックを再利用／A=決定(Enter)・B=やり直す）
(function setupPad(){
  const pad=document.getElementById('pad'); if(!pad) return;
  const fire=(type,key)=>document.dispatchEvent(new KeyboardEvent(type,{key}));
  pad.querySelectorAll('.db').forEach(b=>{
    const key=b.dataset.k;
    let held=false;   // 押していないのに pointerleave(ホバー離脱)で keyup を撃ち、キーボード移動を打ち消さないため
    const dn=e=>{ e.preventDefault(); held=true; fire('keydown',key); };
    const up=e=>{ e.preventDefault(); if(!held) return; held=false; fire('keyup',key); };
    b.addEventListener('pointerdown',dn);
    b.addEventListener('pointerup',up);
    b.addEventListener('pointercancel',up);
    b.addEventListener('pointerleave',up);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  });
  document.getElementById('btnA').addEventListener('pointerdown',e=>{ e.preventDefault(); fire('keydown','Enter'); });
  document.getElementById('btnB').addEventListener('pointerdown',e=>{ e.preventDefault(); document.getElementById('restartBtn').click(); });
})();

function canvasPos(e){
  const rect=canvas.getBoundingClientRect();
  const sx=400/rect.width, sy=400/rect.height;   // 論理400空間へ変換（内部解像度800でも座標は400）
  return { x:(e.clientX-rect.left)*sx, y:(e.clientY-rect.top)*sy };
}
canvas.addEventListener("pointerdown",(e)=>{
  initAudio();
  const p=canvasPos(e);
  if(screen==="select"){
    const idx=Math.floor((p.y-95)/70);
    if(idx>=0 && idx<stages.length){ selIndex=idx; loadStage(idx); }
  }else if(screen==="playing"){
    target={x:p.x+cameraX, y:p.y+cameraY};
  }else if(screen==="clear"){
    screen="select";
  }
});

// ====== ジョイスティック ポーリング ======
// しきい値。配線で上下/左右が逆なら INVERT を切り替えてください。
const JOY_LOW=200, JOY_HIGH=820;
const INVERT_X=false, INVERT_Y=false;

async function pollJoy(){
  try{
    const r=await fetch("/state",{cache:"no-store"});
    if(!r.ok) return;
    const j=await r.json();
    applyJoy(j);
  }catch(e){ /* ジョイスティック未接続なら無視 */ }
}
function applyJoy(j){
  // x==0 && y==0 はフローティング（未接続）と判断してニュートラル扱い
  if(j.x===0 && j.y===0) return;
  let xl=j.x<JOY_LOW, xh=j.x>JOY_HIGH;
  let yl=j.y<JOY_LOW, yh=j.y>JOY_HIGH;
  let left =INVERT_X? xh:xl, right=INVERT_X? xl:xh;
  let up   =INVERT_Y? yh:yl, down =INVERT_Y? yl:yh;
  const btn=j.b===1;

  if(screen==="select"){
    if((up||down)&&navReady){
      selIndex=(selIndex+(down?1:-1)+stages.length)%stages.length;
      navReady=false;
    }
    if(!up&&!down) navReady=true;
    if(btn&&btnReady){ loadStage(selIndex); btnReady=false; }
    if(!btn) btnReady=true;
  }else if(screen==="playing"){
    // 4方向：傾きの大きい軸だけ採用（斜め移動しない）
    const mx=Math.abs(j.x-512), my=Math.abs(j.y-512);
    const hAct=left||right, vAct=up||down;
    joyVX=0; joyVY=0;
    if(hAct && (!vAct || mx>=my)) joyVX = left?-1:1;
    else if(vAct) joyVY = up?-1:1;
    if(btn&&btnReady){ screen="select"; btnReady=false; }
    if(!btn) btnReady=true;
  }else if(screen==="clear"){
    if(btn&&btnReady){ screen="select"; btnReady=false; }
    if(!btn) btnReady=true;
  }
}
setInterval(pollJoy,120);

// ====== 更新 ======
function movePlayer(dx,dy){
  let moved=false;
  if(dx && !hitsWall(player.x+dx,player.y,player.size)){ player.x+=dx; moved=true; }
  if(dy && !hitsWall(player.x,player.y+dy,player.size)){ player.y+=dy; moved=true; }
  // 向き（顔の方向）を記録。横優先で判定
  if(dx<0) player.dir="left"; else if(dx>0) player.dir="right";
  else if(dy<0) player.dir="up"; else if(dy>0) player.dir="down";
  // 歩行アニメ用カウンタ
  if(moved) player.step=(player.step+1)%40;
}

function updateEnemies(){
  for(const e of enemies){
    if(e.vx!==0){
      const nx=e.x+e.vx;
      if(hitsWall(nx,e.y,e.size)||Math.abs(nx-e.sx)>e.patrol) e.vx=-e.vx; else e.x=nx;
    }
    if(e.vy!==0){
      const ny=e.y+e.vy;
      if(hitsWall(e.x,ny,e.size)||Math.abs(ny-e.sy)>e.patrol) e.vy=-e.vy; else e.y=ny;
    }
    if(aabb(player.x,player.y,player.size,e.x,e.y,e.size)){ sfxHit(); respawn(); }
  }
}

function collectCoins(){
  const cx=player.x+player.size/2, cy=player.y+player.size/2;
  for(const c of coins){
    if(!c.got && Math.hypot(cx-c.x,cy-c.y) < c.r+player.size/2){
      c.got=true; gotCoins++; sfxCoin();
    }
  }
}

function checkGoal(){
  if(gotCoins<totalCoins) return;
  const cx=player.x+player.size/2, cy=player.y+player.size/2;
  if(Math.hypot(cx-goal.x,cy-goal.y) < goal.radius+player.size/2){
    screen="clear";
    sfxClear();
    clearTime=(Date.now()-startTime)/1000;
    const b=getBest(stageIndex);
    if(!b || clearTime<Number(b)) localStorage.setItem(bestKey(stageIndex),clearTime);
  }
}

// 指定方向に1歩(speed=2)進めるか（壁判定）
function canStep(d){ const v=DIRV[d]; return !hitsWall(player.x+v[0]*2, player.y+v[1]*2, player.size); }

function update(){
  if(screen!=="playing") return;
  const speed=2;
  let dir=null;

  // 優先: キーボード(最後に押した方向) → ジョイスティック → タップ目標。どれも1方向だけ＝斜めにならない
  for(let i=dirStack.length-1;i>=0;i--){
    const k={up:"w",down:"s",left:"a",right:"d"}[dirStack[i]];
    if(keys[k]){ dir=dirStack[i]; break; }
  }
  if(!dir){
    if(joyVX<0) dir="left"; else if(joyVX>0) dir="right";
    else if(joyVY<0) dir="up"; else if(joyVY>0) dir="down";
  }
  if(!dir && target){
    const cx=player.x+player.size/2, cy=player.y+player.size/2;
    const tx=target.x-cx, ty=target.y-cy;
    if(Math.hypot(tx,ty)<3){ target=null; }
    else{
      const hor=tx<0?"left":"right", ver=ty<0?"up":"down";
      const order = Math.abs(tx)>=Math.abs(ty)? [hor,ver]:[ver,hor];
      for(const d of order){
        const remain = (d===hor)? Math.abs(tx):Math.abs(ty);
        if(remain>2 && canStep(d)){ dir=d; break; }
      }
      if(!dir) dir=order[0];
    }
  }

  const beforeStep=player.step;
  if(dir){ const v=DIRV[dir]; movePlayer(v[0]*speed, v[1]*speed); }
  // 移動中だけ、一定間隔でコツコツ音
  if(player.step!==beforeStep && player.step%9===0) sfxStep();

  updateEnemies();
  collectCoins();
  checkGoal();
  updateCamera();
}

function updateCamera(){
  const mapW=map[0].length*TILE, mapH=map.length*TILE;
  const cx=player.x+player.size/2, cy=player.y+player.size/2;
  cameraX=Math.max(0, Math.min(cx-200, mapW-400));
  cameraY=Math.max(0, Math.min(cy-200, mapH-400));
}

// ====== 描画 ======
function drawSelect(){
  ctx.clearRect(0,0,400,400);
  ctx.textAlign="center";
  ctx.fillStyle="#ffd45e"; ctx.font="bold 26px 'Segoe UI',sans-serif";
  ctx.fillText("ステージ選択",200,50);
  ctx.fillStyle="#8aa0d0"; ctx.font="12px sans-serif";
  ctx.fillText("S T A G E   S E L E C T",200,72);
  const diff=["★☆☆","★★☆","★★★"];
  for(let i=0;i<stages.length;i++){
    const y=120+i*70, sel=(i===selIndex);
    roundRect(60,y-30,280,55,12);
    const g=ctx.createLinearGradient(60,y-30,60,y+25);
    g.addColorStop(0, sel?"#27365f":"#1a2240"); g.addColorStop(1, sel?"#18203c":"#141a30");
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=sel?2.5:1.5; ctx.strokeStyle=sel?"#ffd45e":"#2a375f"; ctx.stroke();
    // 番号バッジ
    ctx.beginPath(); ctx.arc(92,y-2,15,0,Math.PI*2);
    ctx.fillStyle=sel?"#ffd45e":"#27305a"; ctx.fill();
    ctx.fillStyle=sel?"#16203c":"#9fb0d6"; ctx.font="bold 18px 'Segoe UI',sans-serif";
    ctx.fillText(String(i+1),92,y+4);
    // 名前・難易度
    ctx.textAlign="left";
    ctx.fillStyle="#eef2ff"; ctx.font="bold 18px 'Segoe UI',sans-serif";
    ctx.fillText("ステージ "+(i+1),120,y-3);
    ctx.fillStyle="#ffb84a"; ctx.font="12px sans-serif";
    ctx.fillText(diff[i],120,y+15);
    // ベスト
    const b=getBest(i);
    ctx.textAlign="right";
    ctx.fillStyle=b?"#9ad7ff":"#5f6f9c"; ctx.font="13px sans-serif";
    ctx.fillText(b?("🏆 "+Number(b).toFixed(1)+"s"):"未クリア",326,y+2);
    if(sel){ ctx.fillStyle="#ffd45e"; ctx.font="15px sans-serif"; ctx.fillText("▶",326,y-16); }
    ctx.textAlign="center";
  }
  ctx.fillStyle="#6c7ba6"; ctx.font="12px sans-serif";
  ctx.fillText("W/S・上下で選択　Enter・ボタン・タップで決定",200,372);
  ctx.textAlign="left";
}

// ===== 迷路用：パックマン風プレイヤー =====
function drawPlayer(){
  const s=player.size, cx=player.x+s/2, cy=player.y+s/2, r=s/2-1;
  const dir=player.dir||"right";
  // 口の開き具合（歩くとパクパク）。0=閉じ ～ 0.25*PI=最大
  const mouth=Math.abs(Math.sin(player.step*0.16))*0.28*Math.PI + 0.04;
  // 向き→口が開く方向の角度
  const base={right:0, down:Math.PI/2, left:Math.PI, up:-Math.PI/2}[dir];

  // 足元の影
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(cx, player.y+s-1, 10, 3, 0, 0, Math.PI*2); ctx.fill();

  // 本体（黄色い円＋口の切り欠き）
  ctx.fillStyle="#ffe11a";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, base+mouth, base+Math.PI*2-mouth);
  ctx.closePath();
  ctx.fill();
  // 輪郭
  ctx.strokeStyle="#c9a900"; ctx.lineWidth=1.5; ctx.stroke();

  // 目（口の反対側・少し上に）
  const eyeAng=base-Math.PI/2;        // 進行方向に対して上側
  const ex=cx+Math.cos(eyeAng)*r*0.45;
  const ey=cy+Math.sin(eyeAng)*r*0.45;
  ctx.fillStyle="#222";
  ctx.beginPath(); ctx.arc(ex, ey, 2, 0, Math.PI*2); ctx.fill();
}

// ===== RPG用：勇者キャラ（迷路では未使用、RPG編で使う） =====
function drawHero(){
  const s=player.size, cx=player.x+s/2, top=player.y;
  const dir=player.dir||"down";
  // 歩行で脚を交互に動かす（step を sin で揺らす）
  const swing=Math.sin(player.step*0.5)*2;

  // 足元の影
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath(); ctx.ellipse(cx, top+s-1, 10, 3, 0, 0, Math.PI*2); ctx.fill();

  // 脚（2本・交互）
  ctx.fillStyle="#5a3825";
  ctx.fillRect(cx-7, top+s-8+swing, 5, 8);
  ctx.fillRect(cx+2, top+s-8-swing, 5, 8);

  // 体（緑のチュニック・角丸）
  ctx.fillStyle="#2e9e3f";
  roundRect(cx-9, top+12, 18, 14, 4); ctx.fill();
  // ベルト
  ctx.fillStyle="#7a4a1e"; ctx.fillRect(cx-9, top+22, 18, 3);

  // 腕
  ctx.fillStyle="#2e9e3f";
  ctx.fillRect(cx-11, top+13, 3, 9);
  ctx.fillRect(cx+8, top+13, 3, 9);

  // 頭（肌色）
  ctx.fillStyle="#f4c79a";
  ctx.beginPath(); ctx.arc(cx, top+8, 8, 0, Math.PI*2); ctx.fill();

  // 髪（向きで形を変える。上向きは後頭部で顔が隠れる）
  ctx.fillStyle="#6b3b1a";
  ctx.beginPath();
  if(dir==="up"){
    // 後ろ姿：頭全体を髪で覆う
    ctx.arc(cx, top+8, 8, 0, Math.PI*2); ctx.fill();
  }else{
    // 前髪＋サイド
    ctx.arc(cx, top+6, 8, Math.PI, 0); ctx.fill();
    ctx.fillRect(cx-8, top+4, 3, 6);
    ctx.fillRect(cx+5, top+4, 3, 6);
  }

  // 目（上向き以外で表示。向きで位置をずらす）
  if(dir!=="up"){
    let ex=0;
    if(dir==="left") ex=-2;
    if(dir==="right") ex=2;
    ctx.fillStyle="#222";
    if(dir==="left"){
      ctx.beginPath(); ctx.arc(cx-3, top+9, 1.6, 0, Math.PI*2); ctx.fill();
    }else if(dir==="right"){
      ctx.beginPath(); ctx.arc(cx+3, top+9, 1.6, 0, Math.PI*2); ctx.fill();
    }else{
      ctx.beginPath(); ctx.arc(cx-3+ex, top+9, 1.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+3+ex, top+9, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }
}

// 角丸長方形のパスを作る補助関数
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ===== ダンジョン床（市松＋グリッド） =====
function drawFloor(){
  const mapW=map[0].length*TILE, mapH=map.length*TILE;
  ctx.fillStyle="#0e1428"; ctx.fillRect(0,0,mapW,mapH);
  for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){
    if(map[y][x]!=="#" && (x+y)%2===0){ ctx.fillStyle="rgba(120,150,220,0.035)"; ctx.fillRect(x*TILE,y*TILE,TILE,TILE); }
  }
  ctx.strokeStyle="rgba(120,150,220,0.06)"; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0;x<=map[0].length;x++){ ctx.moveTo(x*TILE,0); ctx.lineTo(x*TILE,mapH); }
  for(let y=0;y<=map.length;y++){ ctx.moveTo(0,y*TILE); ctx.lineTo(mapW,y*TILE); }
  ctx.stroke();
}

// ===== 石壁ブロック（ベベル） =====
function drawWall(X,Y){
  const g=ctx.createLinearGradient(X,Y,X,Y+TILE);
  g.addColorStop(0,"#46568a"); g.addColorStop(1,"#2a3760");
  ctx.fillStyle=g; ctx.fillRect(X,Y,TILE,TILE);
  ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(X,Y,TILE,3); ctx.fillRect(X,Y,3,TILE);
  ctx.fillStyle="rgba(0,0,0,0.32)"; ctx.fillRect(X,Y+TILE-3,TILE,3); ctx.fillRect(X+TILE-3,Y,3,TILE);
  ctx.strokeStyle="rgba(0,0,0,0.18)"; ctx.lineWidth=1; ctx.strokeRect(X+0.5,Y+0.5,TILE-1,TILE-1);
}

// ===== コイン（金貨・グロー＋輝き＋ふわふわ） =====
function drawCoin(c){
  const x=c.x, y=c.y+Math.sin(Date.now()*0.005+c.x*0.05)*2, r=c.r;
  let gl=ctx.createRadialGradient(x,y,0,x,y,r*2.4);
  gl.addColorStop(0,"rgba(255,210,80,0.45)"); gl.addColorStop(1,"rgba(255,210,80,0)");
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,y,r*2.4,0,Math.PI*2); ctx.fill();
  let g=ctx.createRadialGradient(x-2,y-2,1,x,y,r);
  g.addColorStop(0,"#fff3bf"); g.addColorStop(0.55,"#ffd24a"); g.addColorStop(1,"#e09a12");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#a8780a"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.arc(x-2.4,y-2.4,1.5,0,Math.PI*2); ctx.fill();
}

// ===== ゴール（全コインで光る出口／未取得は南京錠でロック） =====
function drawGoal(){
  const open=(gotCoins>=totalCoins), x=goal.x, y=goal.y, t=Date.now()*0.004;
  if(open){
    const pr=goal.radius+5+Math.sin(t*1.6)*2;
    let gl=ctx.createRadialGradient(x,y,2,x,y,pr*2.2);
    gl.addColorStop(0,"rgba(110,235,180,0.5)"); gl.addColorStop(1,"rgba(110,235,180,0)");
    ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(x,y,pr*2.2,0,Math.PI*2); ctx.fill();
    for(let k=0;k<3;k++){ ctx.strokeStyle="rgba(180,255,215,"+(0.55-k*0.14)+")"; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(x,y,pr-k*4,t+k,t+k+Math.PI*1.5); ctx.stroke(); }
    let g=ctx.createRadialGradient(x,y,0,x,y,pr*0.6);
    g.addColorStop(0,"#eafff2"); g.addColorStop(1,"#37c98a");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,pr*0.55,0,Math.PI*2); ctx.fill();
  }else{
    ctx.fillStyle="#46506e"; ctx.beginPath(); ctx.arc(x,y,goal.radius+2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="#2a3148"; ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle="#cdd6ee"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y-2,3.4,Math.PI,0); ctx.stroke();
    ctx.fillStyle="#cdd6ee"; roundRect(x-5,y-1,10,8,2); ctx.fill();
    ctx.fillStyle="#46506e"; ctx.fillRect(x-0.8,y+1,1.6,3);
  }
}

// ===== 敵：ゴースト風 =====
function drawGhost(e, color){
  const s=e.size, cx=e.x+s/2, top=e.y, r=s/2;
  const baseY=top+s;            // 体の下端
  const wob=Math.sin(Date.now()*0.006 + e.x)*1.2;  // スカートの揺れ

  // 足元のグロー（色を薄く広げる）
  let gl=ctx.createRadialGradient(cx,top+r,1,cx,top+r,r*1.9);
  gl.addColorStop(0,color+"55"); gl.addColorStop(1,color+"00");
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(cx,top+r,r*1.9,0,Math.PI*2); ctx.fill();

  // 体（上は半円、下はギザギザのスカート）
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(cx, top+r, r, Math.PI, 0);          // 頭頂のドーム
  ctx.lineTo(cx+r, baseY-2+wob);
  // 下端を3つの波で
  const n=3, w=(s)/n;
  for(let k=0;k<n;k++){
    const x0=cx+r-k*w;
    ctx.lineTo(x0-w/2, baseY-5+wob);
    ctx.lineTo(x0-w,   baseY-2-wob);
  }
  ctx.closePath();
  ctx.fill();

  // 目（白目＋黒目。黒目はプレイヤー方向を見る）
  const pcx=player.x+player.size/2, pcy=player.y+player.size/2;
  const ang=Math.atan2(pcy-(top+r), pcx-cx);
  const dx=Math.cos(ang)*1.5, dy=Math.sin(ang)*1.5;
  for(const ox of [-4,4]){
    ctx.fillStyle="#fff";
    ctx.beginPath(); ctx.arc(cx+ox, top+r-1, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle="#1a2a6b";
    ctx.beginPath(); ctx.arc(cx+ox+dx, top+r-1+dy, 1.6, 0, Math.PI*2); ctx.fill();
  }
}

function drawPlaying(){
  ctx.clearRect(0,0,400,400);
  ctx.save();
  ctx.translate(-cameraX, -cameraY);

  drawFloor();
  // 壁（石ブロック）
  for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){
    if(map[y][x]==="#") drawWall(x*TILE,y*TILE);
  }
  // コイン
  for(const c of coins){ if(!c.got) drawCoin(c); }
  // ゴール
  drawGoal();
  // 敵（ゴースト）
  const GHOST_COLORS=["#e0457b","#36c2e0","#ff9a40","#9b6bff","#43c95a","#e0d048"];
  enemies.forEach((e,i)=>drawGhost(e, GHOST_COLORS[i%GHOST_COLORS.length]));
  // タップ目標
  if(target){
    ctx.strokeStyle="rgba(255,212,94,0.9)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(target.x,target.y,8,0,Math.PI*2); ctx.stroke();
  }
  // プレイヤー（パックマン風）
  drawPlayer();

  ctx.restore();

  // HUD（チップに値だけ反映）
  const now=(Date.now()-startTime)/1000;
  document.getElementById("timer").textContent=now.toFixed(1)+"s";
  document.getElementById("coininfo").textContent=gotCoins+"/"+totalCoins;
  const b=getBest(stageIndex);
  document.getElementById("best").textContent=b?(Number(b).toFixed(1)+"s"):"--";
}

function drawClear(){
  drawPlaying();
  ctx.fillStyle="rgba(8,12,25,0.72)"; ctx.fillRect(0,0,400,400);
  const px=70,py=108,pw=260,ph=188;
  roundRect(px,py,pw,ph,16);
  let g=ctx.createLinearGradient(px,py,px,py+ph); g.addColorStop(0,"#202b4e"); g.addColorStop(1,"#141a30");
  ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="#ffd45e"; ctx.stroke();
  ctx.textAlign="center";
  ctx.font="38px sans-serif"; ctx.fillText("🏆",200,py+48);
  ctx.fillStyle="#ffd45e"; ctx.font="bold 25px 'Segoe UI',sans-serif"; ctx.fillText("ステージクリア！",200,py+84);
  ctx.fillStyle="#bcc8e8"; ctx.font="14px sans-serif"; ctx.fillText("ステージ "+(stageIndex+1),200,py+108);
  ctx.fillStyle="#eef2ff"; ctx.font="bold 20px 'Segoe UI',sans-serif"; ctx.fillText("タイム  "+clearTime.toFixed(1)+"s",200,py+136);
  const b=getBest(stageIndex), isNew=(b&&Math.abs(Number(b)-clearTime)<0.05);
  ctx.fillStyle=isNew?"#ffd45e":"#9ad7ff"; ctx.font="13px sans-serif";
  ctx.fillText(isNew?"★ 新記録！":("ベスト "+(b?Number(b).toFixed(1):clearTime.toFixed(1))+"s"),200,py+158);
  ctx.fillStyle="#8aa0d0"; ctx.font="12px sans-serif"; ctx.fillText("Enter・ボタン・タップで選択へ",200,py+180);
  ctx.textAlign="left";
}

function draw(){
  ctx.setTransform(2,0,0,2,0,0);   // 内部解像度800で2倍描画（くっきり）。以降の座標は400空間のまま
  if(screen==="select") drawSelect();
  else if(screen==="playing") drawPlaying();
  else drawClear();
}

function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
